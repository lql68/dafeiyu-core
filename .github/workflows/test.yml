name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (zero runtime deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Run examples (smoke)
        run: |
          python examples/rhythm_demo.py    > /dev/null
          python examples/selfstory_demo.py > /dev/null
          python examples/autonomy_demo.py  > /dev/null
