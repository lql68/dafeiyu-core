[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dafeiyu-core"
version = "0.1.0"
description = "数字生命内核：生理节律 / 情绪归因 / 信念与自传 / 自我模型"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lql68" }]
keywords = ["llm", "agent", "personality", "emotion", "memory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# 零外部依赖 —— 只用标准库（json / sqlite3 / math / datetime / hashlib）
dependencies = []

[project.optional-dependencies]
# 接真模型时才需要
llm = ["httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/lql68/dafeiyu-blueprint"
Documentation = "https://github.com/lql68/dafeiyu-blueprint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dafeiyu = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
