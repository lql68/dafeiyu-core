[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dafeiyu-core"
version = "0.2.0"
description = "数字生命内核：生理节律 / 情绪归因 / 信念与自传 / 自我模型 / 意图与认知"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "lql68" }]
keywords = ["llm", "agent", "personality", "emotion", "memory", "agency"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

# 核心零外部依赖 —— 只用标准库（json / sqlite3 / math / datetime / hashlib / re）
dependencies = []

[project.optional-dependencies]
# school 的异步落库
asy = ["aiosqlite>=0.19"]
# 接真模型时才需要
llm = ["httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/lql68/dafeiyu-core"
Documentation = "https://github.com/lql68/dafeiyu-blueprint"
Source = "https://github.com/lql68/dafeiyu-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dafeiyu = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
